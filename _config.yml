# Footer info
affiliation: >
  Moses Stewart<br/>
  PhD Candidate in Economics<br/>
  Undecided

#location: >
#  Harvard University<br/>
#  511 Adams Mail Center<br/>
#  Cambridge, MA 02138

contact: >
  <a href="https://github.com/MosesStewart"><i class="fa fa-github fa-1x"></i> My Github profile</a>

# Pages shown in navbar
nav_pages:
  - name: research

include:
  - .htaccess
  - _pages

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true # default for kramdown is false. This will enable using Markdown links

plugins: 
  - jekyll-scholar

scholar:
  last_name: Stewart
  first_name: [Moses]

  style: citesty
  locale: en

  source: /assets/
  bibliography: ref.bib
  bibliography_template: bibtemplate
  bibliography_list_tag: "ul"
  bibliography_item_tag: "li"
  sort_by: year, month
  order: descending

  replace_strings: true
  join_strings: true

  details_dir: bibliography
  details_layout: bibtex.html
  details_link: Details

  query: "@*"


exclude:
  - Gemfile
  - Gemfile.lock
  - update_boostrap.sh
  - switch_theme.sh
  - tags
  - Rakefile
